name: Bug report
description: Report a reproducible mcp-gateway defect.
title: "Bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Remove credentials, private backend content, personal paths, and live-service data. Use the private vulnerability form under the Security tab for undisclosed security issues.
  - type: input
    id: version
    attributes:
      label: mcp-gateway version
      description: Paste the output of `mcp-gateway --version`.
      placeholder: mcp-gateway 1.2.1
    validations:
      required: true
  - type: dropdown
    id: install_mode
    attributes:
      label: Installation mode
      options:
        - Public PyPI uv tool
        - GitHub release wheel
        - Contributor checkout
    validations:
      required: true
  - type: input
    id: operating_system
    attributes:
      label: Operating system
      placeholder: macOS 26.0, Ubuntu 24.04, Windows 11
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Give the smallest deterministic sequence that triggers the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include redacted errors or logs when useful.
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Note the backend transport, MCP client, or deployment mode when relevant.
