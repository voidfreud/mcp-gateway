name: release

# Pushing a v* tag builds the wheel and publishes a GitHub release with it
# attached. No PyPI — distribution is `uv tool install` from this repo by
# choice (the PyPI name is taken; pyproject carries Private :: Do Not Upload).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: extractions/setup-just@v2
      # a release must pass the same gate as every PR
      - run: uv sync
      - run: just check
      - run: uv build
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
            --title "$GITHUB_REF_NAME" --generate-notes
