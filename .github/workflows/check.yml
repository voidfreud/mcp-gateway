name: check

# ADR-0003 defines the hermetic CI/local-live split; ADR-0006 adds raw-wire and
# official-conformance checks using disposable fixtures. `just verify` remains
# local because it exercises the installed daemon and configured backends.
on:
  pull_request:
  push:
    branches: [main]

# A superseded run (new push to the same PR/branch) is cancelled instead of
# burning minutes to completion.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      # astral-sh/setup-uv v8.3.2
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.10.9"
          # cache the uv download/wheel cache between runs, keyed on the lock
          enable-cache: true
          cache-dependency-glob: uv.lock
      # extractions/setup-just v4.0.0
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3
      # the lockfile must be consistent with pyproject — catches a dependency
      # edit that forgot `uv lock`
      - run: uv lock --check
      - run: uv sync --locked
      - name: Check tracked documentation links
        run: just docs-check
      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: uv run python tools/release_contract.py pr-title --title "$PR_TITLE"
      - run: just check

  mcp-contract:
    name: MCP contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      # astral-sh/setup-uv v8.3.2
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          version: "0.10.9"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Prepare the locked official conformance runner
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tests/conformance
      - run: uv sync --locked
      - name: Gateway raw-wire contract
        env:
          # Both launchers retain passing/failing receipts under this directory
          # so the artifact step can publish them with a stable glob.
          TMPDIR: ${{ runner.temp }}
        run: uv run python tests/live/run_mcp_wire.py --keep
      - name: Official MCP conformance smoke
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run python tests/conformance/run_official.py --keep
      - name: Assemble redacted protocol receipts
        if: always()
        run: |
          uv run python tools/ci_receipts.py \
            --scratch-root "$RUNNER_TEMP" \
            --output-dir "$RUNNER_TEMP/mcp-gateway-ci-receipts"
      - name: Publish redacted protocol receipts
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-contract-receipts-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/mcp-gateway-ci-receipts
          if-no-files-found: warn
          retention-days: 14
