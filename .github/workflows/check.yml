name: check

# ADR-0003: check-only CI. Runs the pure-logic gate (`just check`) on PRs and
# main — zero backends, zero launchd, no secrets. The live gate (`just verify`)
# stays local by design (ADR-0001, as amended).
on:
  pull_request:
  push:
    branches: [main]

# A superseded run (new push to the same PR/branch) is cancelled instead of
# burning minutes to completion.
concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          # cache the uv download/wheel cache between runs, keyed on the lock
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: extractions/setup-just@v2
      # the lockfile must be consistent with pyproject — catches a dependency
      # edit that forgot `uv lock`
      - run: uv lock --check
      - run: uv sync --locked
      - run: just check
      # the wheel must build and carry its data files (admin.html + the seed
      # config ship inside the package — a packaging regression breaks install)
      - run: uv build
      - run: |
          python3 - <<'EOF'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          for want in ("mcp_gateway/admin.html", "mcp_gateway/config.default.toml"):
              assert any(n.endswith(want) for n in names), f"{want} missing from {whl}"
          print("wheel carries its data files")
          EOF
      - name: Install wheel in a clean environment
        run: |
          python3 -m venv "$RUNNER_TEMP/mcp-gateway-wheel-venv"
          "$RUNNER_TEMP/mcp-gateway-wheel-venv/bin/python" -m pip install --no-deps dist/*.whl
          "$RUNNER_TEMP/mcp-gateway-wheel-venv/bin/python" -m mcp_gateway --version

  mcp-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync --locked
      - name: Gateway raw-wire contract
        env:
          # Both launchers retain passing/failing receipts under this directory
          # so the artifact step can publish them with a stable glob.
          TMPDIR: ${{ runner.temp }}
        run: uv run python tests/live/run_mcp_wire.py --keep
      - name: Official MCP conformance smoke
        env:
          TMPDIR: ${{ runner.temp }}
        run: uv run python tests/conformance/run_official.py --keep
      - name: Publish protocol receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-contract-receipts
          path: ${{ runner.temp }}/mcp-gateway-*
          if-no-files-found: warn
          retention-days: 14
