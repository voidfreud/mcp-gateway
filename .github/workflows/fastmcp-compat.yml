name: fastmcp compatibility canary

# Production stays exact-pinned. This non-release lane discovers whether a
# newer FastMCP still satisfies our explicit public and private API contracts.
# It is scheduled/manual only, so it is an advisory compatibility signal rather
# than a pull-request merge requirement.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  # Avoid competing online resolver runs while preserving an in-progress
  # nightly receipt for investigation.
  group: fastmcp-compat-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  newest-fastmcp:
    name: FastMCP compatibility canary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      # actions/setup-python v6.3.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python-version }}
      # astral-sh/setup-uv v8.3.2
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Resolve newest FastMCP in an isolated checkout
        id: candidate
        run: |
          candidate_dir="$(mktemp -d)"
          receipt="${RUNNER_TEMP}/fastmcp-compat-receipt.txt"
          printf 'status=resolving\n' > "$receipt"
          git clone --quiet --no-hardlinks "$GITHUB_WORKSPACE" "$candidate_dir"
          pin="$(python - "$candidate_dir/pyproject.toml" <<'PY'
          from pathlib import Path
          import sys
          import tomllib

          path = Path(sys.argv[1])
          dependencies = tomllib.loads(path.read_text())["project"]["dependencies"]
          dependency = next(item for item in dependencies if item.startswith("fastmcp=="))
          print(dependency.removeprefix("fastmcp=="))
          PY
          )"
          uv sync --project "$candidate_dir" --locked --all-groups
          uv pip install --python "$candidate_dir/.venv/bin/python" \
            --upgrade "fastmcp>=$pin"
          version="$("$candidate_dir/.venv/bin/python" -c 'from importlib.metadata import version; print(version("fastmcp"))')"
          {
            echo "dir=$candidate_dir"
            echo "pin=$pin"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          printf 'pinned_fastmcp=%s\ncandidate_fastmcp=%s\n' "$pin" "$version" > "$receipt"
          echo "Resolved FastMCP $version (project pin: $pin)"
      - name: Skip when the pin is still newest
        if: steps.candidate.outputs.version == steps.candidate.outputs.pin
        run: |
          echo "decision=skipped-current-pin-is-newest" >> "$RUNNER_TEMP/fastmcp-compat-receipt.txt"
          echo "No newer FastMCP release; canary skipped."
      - name: Run full compatibility gate against candidate
        if: steps.candidate.outputs.version != steps.candidate.outputs.pin
        env:
          CANDIDATE_DIR: ${{ steps.candidate.outputs.dir }}
        run: |
          receipt="$RUNNER_TEMP/fastmcp-compat-receipt.txt"
          echo "decision=running-full-compatibility-gate" >> "$receipt"
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "result=failed" >> "$receipt"; fi; exit "$status"' EXIT
          cd "$CANDIDATE_DIR"
          export PATH="$CANDIDATE_DIR/.venv/bin:$PATH"
          python -m pytest -q tests
          python tests/live/run_mcp_wire.py
          python -c \
            "import mcp_gateway.server, mcp_gateway.admin, mcp_gateway.config_loader; print('candidate imports OK')"
          echo "result=passed" >> "$receipt"
      - name: Publish compatibility receipt
        if: always()
        # actions/upload-artifact v4.6.2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fastmcp-compat-receipt-py${{ matrix.python-version }}
          path: ${{ runner.temp }}/fastmcp-compat-receipt.txt
          if-no-files-found: warn
          retention-days: 14
