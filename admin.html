<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mcp-gateway · admin</title>
<style>
  :root {
    --bg: #0f1115; --panel: #161a21; --panel2: #1c222b; --line: #2a313c;
    --fg: #e6e9ef; --mut: #8b95a5; --accent: #5aa9ff; --ok: #54d18c;
    --warn: #e0a14a; --ro: #232a34;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, system-ui, sans-serif;
         background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 18px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .sub { color: var(--mut); font-size: 12px; }
  header .spacer { flex: 1; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line);
           background: var(--panel2); color: var(--fg); border-radius: 7px; padding: 6px 12px; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06203f; font-weight: 600; }
  button.ghost { background: transparent; }
  button.danger:hover { border-color: #e06a6a; color: #ff9b9b; }
  .wrap { flex: 1; display: flex; min-height: 0; }
  /* left pane */
  aside { width: 260px; border-right: 1px solid var(--line); background: var(--panel);
          overflow-y: auto; flex-shrink: 0; }
  .b-item { padding: 11px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .b-item:hover { background: var(--panel2); }
  .b-item.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--accent); }
  .b-item .nm { font-weight: 600; }
  .b-item .meta { color: var(--mut); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; }
  .badge { font-size: 10.5px; text-transform: uppercase; letter-spacing: .4px;
           padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); color: var(--mut); }
  /* detail */
  main { flex: 1; overflow-y: auto; padding: 18px 22px; }
  .empty { color: var(--mut); margin-top: 40px; text-align: center; }
  .b-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px; }
  .b-head h2 { margin: 0; font-size: 17px; }
  .b-head code { color: var(--mut); font-size: 12px; }
  .b-actions { margin: 10px 0 18px; display: flex; gap: 8px; }
  .tool { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; background: var(--panel); }
  .tool.disabled { opacity: .55; }
  .t-head { display: flex; align-items: center; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .t-head .orig { font-family: ui-monospace, Menlo, monospace; color: var(--mut); font-size: 12px; }
  .t-head .arrow { color: var(--mut); }
  .t-head .newname { font-family: ui-monospace, Menlo, monospace; color: var(--accent); font-weight: 600; }
  .t-head .spacer { flex: 1; }
  .t-body { padding: 12px 14px; display: none; }
  .tool.open .t-body { display: block; }
  .t-head { cursor: pointer; }
  label { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px;
          color: var(--mut); margin: 10px 0 4px; }
  input[type=text], textarea {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--fg);
    border-radius: 7px; padding: 7px 9px; font: inherit; }
  input[readonly] { background: var(--ro); color: var(--mut); }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 38px; }
  .hint { font-size: 11.5px; color: var(--mut); margin-top: 3px; }
  /* live byte-count for capped fields ([data-cap]): bottom-right, gray; red at/over cap */
  .cap-wrap { position: relative; }
  .cap-wrap textarea { padding-bottom: 20px; }
  .cap-count { position: absolute; right: 9px; bottom: 6px; pointer-events: none;
               font: 11px/1 ui-monospace, Menlo, monospace; color: var(--mut); opacity: .55; }
  .cap-count.over { color: #ff9b9b; opacity: 1; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .params { margin-top: 14px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .params > .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .4px; color: var(--mut); }
  .param { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-top: 8px; background: var(--panel2); }
  .param .p-top { display: flex; align-items: center; gap: 10px; }
  .param .p-top .orig { font-family: ui-monospace, Menlo, monospace; color: var(--mut); font-size: 12px; }
  .param .p-top .orig .req { color: var(--warn); font-weight: 700; cursor: help; }
  .chk { display: flex; align-items: center; gap: 6px; color: var(--mut); font-size: 12px; user-select: none; }
  .saved { font-size: 12px; color: var(--ok); opacity: 0; transition: opacity .2s; }
  .saved.show { opacity: 1; }
  /* instructions */
  .instr { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 18px;
           background: var(--panel); padding: 12px 14px; }
  .instr h3 { margin: 0 0 2px; font-size: 14px; }
  .instr .si { color: var(--mut); font-size: 12px; font-family: ui-monospace, Menlo, monospace; }
  .instr textarea { min-height: 90px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .preview { background: var(--ro); border: 1px solid var(--line); border-radius: 7px;
             padding: 9px 11px; white-space: pre-wrap; color: var(--mut); font-size: 12px;
             font-family: ui-monospace, Menlo, monospace; max-height: 240px; overflow-y: auto; }
  .b-item.gw .nm { color: var(--accent); }
  /* modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: 460px; max-width: 92vw; }
  .modal h3 { margin: 0 0 14px; }
  .modal .foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  .modal .err { color: #ff9b9b; font-size: 12.5px; min-height: 16px; margin-top: 8px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
           background: var(--panel2); border: 1px solid var(--accent); color: var(--fg);
           padding: 10px 16px; border-radius: 8px; display: none; }
  .toast.show { display: block; }
</style>
</head>
<body>
<header>
  <h1>mcp-gateway</h1>
  <span class="sub">edit what Claude Code sees · changes save + reload automatically</span>
  <span class="spacer"></span>
  <span id="saved" class="saved">saved ✓</span>
  <button class="primary" onclick="openImport()">+ Import MCP</button>
</header>
<div class="wrap">
  <aside id="list"></aside>
  <main id="detail"><div class="empty">Select an MCP on the left.</div></main>
</div>

<div class="modal-bg" id="importBg">
  <div class="modal">
    <h3>Import an MCP backend</h3>
    <label>Name (id + tool prefix)</label>
    <input type="text" id="im_name" placeholder="exa" />
    <label>Transport</label>
    <select id="im_transport" onchange="importTransportChange()"
            style="width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--fg);border-radius:7px;padding:7px 9px;">
      <option value="http">http</option>
      <option value="streamable-http">streamable-http</option>
      <option value="sse">sse</option>
      <option value="stdio">stdio</option>
    </select>
    <div id="im_http">
      <label>URL</label>
      <input type="text" id="im_url" placeholder="https://host/mcp" />
      <div class="row">
        <div><label>Auth header (optional)</label><input type="text" id="im_ah" placeholder="Authorization" /></div>
        <div><label>Auth value (optional)</label><input type="text" id="im_av" placeholder="Bearer ${EXA_TOKEN}" /></div>
      </div>
    </div>
    <div id="im_stdio" style="display:none">
      <label>Command</label>
      <input type="text" id="im_cmd" placeholder="/path/to/server  or  uvx" />
      <label>Args (space-separated)</label>
      <input type="text" id="im_args" placeholder="serena-mcp" />
    </div>
    <div class="err" id="im_err"></div>
    <div class="foot">
      <button class="ghost" onclick="closeImport()">Cancel</button>
      <button class="primary" id="im_go" onclick="doImport()">Import &amp; connect</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r=document) => r.querySelector(s);
const GATEWAY = '__gateway__';  // sentinel for the gateway pseudo-item
let STATE = null, SELECTED = null;
const timers = {};

async function api(method, path, body) {
  const opt = { method, headers: {} };
  if (body !== undefined) { opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  const r = await fetch(path, opt);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
}
function toast(msg, ms=2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), ms); }
function flashSaved() { const s = $('#saved'); s.classList.add('show'); setTimeout(() => s.classList.remove('show'), 1200); }

async function load() {
  STATE = await api('GET', '/admin/api/state');
  renderList();
  if (SELECTED && STATE.backends.find(b => b.name === SELECTED)) renderDetail(SELECTED);
  else { SELECTED = null; $('#detail').innerHTML = '<div class="empty">Select an MCP on the left.</div>'; }
}

function renderList() {
  const el = $('#list');
  el.innerHTML = '';
  // Gateway pseudo-item: a read-only overview of the per-backend MCP endpoints.
  const gw = document.createElement('div');
  gw.className = 'b-item gw' + (SELECTED === GATEWAY ? ' sel' : '');
  gw.onclick = () => { SELECTED = GATEWAY; renderList(); renderDetail(GATEWAY); };
  const nEp = STATE.backends.length;
  gw.innerHTML = `<div class="nm">⚙ Gateway</div>
    <div class="meta"><span>${nEp} endpoint${nEp === 1 ? '' : 's'}</span></div>`;
  el.appendChild(gw);
  STATE.backends.forEach(b => {
    const d = document.createElement('div');
    d.className = 'b-item' + (b.name === SELECTED ? ' sel' : '');
    d.onclick = () => { SELECTED = b.name; renderList(); renderDetail(b.name); };
    const overridden = b.tools.filter(t => t.name || t.title || t.description || !t.enabled
      || t.params.some(p => p.name || p.description || p.hide)).length;
    d.innerHTML = `<div class="nm">${esc(b.name)}</div>
      <div class="meta"><span class="badge">${b.transport}</span>
      <span>${b.tools.length} tools</span>${overridden ? `<span>· ${overridden} edited</span>` : ''}
      ${b.introspected ? '' : '<span style="color:var(--warn)">· not introspected</span>'}</div>`;
    el.appendChild(d);
  });
}

function renderDetail(name) {
  if (name === GATEWAY) return renderGateway();
  const b = STATE.backends.find(x => x.name === name);
  const m = $('#detail');
  const conn = b.transport === 'http' ? esc(b.url || '') : esc((b.command || '') + ' ' + (b.args || []).join(' '));
  m.innerHTML = `
    <div class="b-head"><h2>${esc(b.name)}</h2><span class="badge">${b.transport}</span><code>${conn}</code></div>
    <div class="hint" style="margin:-2px 0 12px">MCP endpoint <code>http://${esc(STATE.host)}:${STATE.port}${esc(b.endpoint || '')}</code> — register as its own server in Claude Code</div>
    <div class="b-actions">
      <label class="chk" title="pin ALL this backend's tools to load upfront (eager)">
        <input type="checkbox" id="b-pin" ${b.always_load ? 'checked' : ''}
               onchange="pinBackend('${esc(b.name)}', this.checked)"> 📌 pin all tools (eager)</label>
      <span class="spacer" style="flex:1"></span>
      <button class="ghost" onclick="reintrospect('${esc(b.name)}')">Re-introspect</button>
      <button class="ghost danger" onclick="delBackend('${esc(b.name)}')">Remove backend</button>
    </div>
    ${backendInstrSection(b)}
    <div id="tools"></div>`;
  wireInstr(m, b.name, b.default_instructions);
  wireCaps(m);  // live byte-count on the backend "Server instructions" textarea
  const tw = $('#tools', m);
  if (!b.introspected) { tw.innerHTML = '<div class="empty">Backend not introspected yet — click Re-introspect.</div>'; return; }
  b.tools.forEach(t => tw.appendChild(toolCard(b, t)));
}

// Per-backend server instructions: prefilled with the override else the captured
// original (so it shows what flows into the gateway's composed blurb). Empty ->
// inherit the original; if the backend sends none, the box is empty to add your own.
function backendInstrSection(b) {
  const eff = b.instructions ?? b.default_instructions ?? '';
  const has = b.default_instructions != null && b.default_instructions !== '';
  const si = b.server_info ? `${b.server_info.name} ${b.server_info.version || ''}`.trim() : '';
  return `<div class="instr">
    <h3>Server instructions</h3>
    <div class="si">${si ? esc(si) + ' · ' : ''}the always-loaded blurb this MCP sends; folded into the gateway's instructions</div>
    <textarea class="f-instr" data-cap="2048" data-default="${esc(b.default_instructions ?? '')}"
      placeholder="${has ? '' : '(this server sends no instructions — type to add your own)'}">${esc(eff)}</textarea>
    <div class="hint">Empty = inherit the server's original${has ? '' : ' (none)'}. Edits reload live.</div>
  </div>`;
}

// Wire a backend's instructions textarea: debounce-save; on blur refill to the
// original only when it HAS one (so "empty = inherit" stays reachable when none).
function wireInstr(root, backend, def) {
  const ta = $('.f-instr', root);
  if (!ta) return;
  ta.addEventListener('input', () => scheduleInstr(backend, ta));
  ta.addEventListener('blur', () => {
    if (ta.value.trim() === '' && def) ta.value = def;
    flushInstr(backend, ta);
  });
}

// Live byte-count for any [data-cap] field: a small bottom-right span showing
// UTF-8 BYTES (TextEncoder, not .length — which is UTF-16 units) against the
// field's own cap, red at/over the cap. Wraps the field for positioning.
// Idempotent: re-running over the same field is a no-op (capWired guard).
function wireCaps(root) {
  const enc = new TextEncoder();
  root.querySelectorAll('[data-cap]').forEach(field => {
    if (field.dataset.capWired) return;            // never double-attach
    field.dataset.capWired = '1';
    const cap = parseInt(field.dataset.cap, 10);
    const wrap = document.createElement('div');
    wrap.className = 'cap-wrap';
    field.parentNode.insertBefore(wrap, field);    // wrap field for bottom-right anchor
    wrap.appendChild(field);
    const count = document.createElement('span');
    count.className = 'cap-count';
    wrap.appendChild(count);
    const upd = () => {
      const n = enc.encode(field.value).length;    // UTF-8 bytes — matches CC's 2048-byte cap
      count.textContent = n + ' / ' + cap;
      count.classList.toggle('over', n >= cap);    // red at or beyond the cap
    };
    field.addEventListener('input', upd);
    field.addEventListener('blur', upd);           // also catch programmatic refills on blur
    upd();                                          // initial paint
  });
}

// Gateway pseudo-detail: a read-only overview of the per-backend MCP endpoints.
// Each backend is its own MCP server now (its own URL + its own ~2KB
// instructions budget), so there is no single cross-backend "gateway
// instructions" — edit each backend's Server instructions on its own page. This
// page lists the endpoints and how much of each 2KB instructions budget is used.
function renderGateway() {
  const m = $('#detail');
  const base = `http://${esc(STATE.host)}:${STATE.port}`;
  const enc = new TextEncoder();
  const rows = STATE.backends.map(b => {
    const instr = b.instructions ?? b.default_instructions ?? '';
    const bytes = enc.encode(instr).length;
    const over = bytes > 2048;
    return `<tr>
      <td style="padding:4px 8px"><b>${esc(b.name)}</b></td>
      <td style="padding:4px 8px"><code>${esc(base + (b.endpoint || ''))}</code></td>
      <td style="padding:4px 8px;text-align:right;color:${over ? '#ff9b9b' : 'var(--mut)'}">${bytes} / 2048 B</td>
    </tr>`;
  }).join('');
  m.innerHTML = `
    <div class="b-head"><h2>⚙ Gateway</h2><code>${STATE.backends.length} MCP endpoint(s)</code></div>
    <p class="hint" style="margin:0 0 14px">Each backend is exposed as its <b>own MCP endpoint</b> below — register each as a
      separate server in Claude Code, so each gets its own ~2KB instructions budget. Edit a backend's server
      instructions on its own page (left).</p>
    <div class="instr">
      <h3>Endpoints</h3>
      <table style="width:100%;border-collapse:collapse;font-size:13px">
        <thead><tr style="color:var(--mut);text-align:left">
          <th style="padding:4px 8px">Backend</th><th style="padding:4px 8px">URL</th>
          <th style="padding:4px 8px;text-align:right">Instructions</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// Editable fields are PREFILLED with their effective value (override if set,
// else the backend default) so they are never blank — what you see is what
// Claude Code gets. The read-only "real" name is the provider-facing identifier
// the gateway forwards to (not editable).
function toolCard(b, t) {
  const card = document.createElement('div');
  card.className = 'tool' + (t.enabled ? '' : ' disabled');
  card.dataset.original = t.original;
  card.dataset.defaultName = t.default_name;
  const name = t.name || t.default_name;
  const title = t.title || t.default_title || '';
  const desc = t.description || t.default_description || '';
  card.innerHTML = `
    <div class="t-head" onclick="this.parentElement.classList.toggle('open')">
      <span class="orig" title="real MCP tool name (provider-facing, not editable)">${esc(t.original)}</span>
      <span class="arrow">→</span>
      <span class="newname">${esc(name)}</span><span class="spacer"></span>
      <label class="chk" onclick="event.stopPropagation()" title="load this tool UPFRONT — exempt from tool-search deferral (anthropic/alwaysLoad)">
        <input type="checkbox" class="f-always" ${t.always_load ? 'checked' : ''}> 📌 eager</label>
      <label class="chk" onclick="event.stopPropagation()">
        <input type="checkbox" class="f-enabled" ${t.enabled ? 'checked' : ''}> broadcast</label>
    </div>
    <div class="t-body">
      <div class="row">
        <div><label>Broadcast name</label><input type="text" class="f-name" value="${esc(name)}" data-default="${esc(t.default_name)}"></div>
        <div><label>Title</label><input type="text" class="f-title" value="${esc(title)}" data-default="${esc(t.default_title||'')}"></div>
      </div>
      <label>Description (what Claude reads)</label>
      <textarea class="f-desc" data-cap="2048" data-default="${esc(t.default_description||'')}">${esc(desc)}</textarea>
      <div class="params">
        <div class="lbl">Parameters</div>
        ${t.params.map(p => paramRow(p)).join('')}
      </div>
      ${schemaSection(t)}
      <div style="margin-top:12px;display:flex;gap:8px;">
        <button class="ghost" onclick="resetTool('${esc(b.name)}','${esc(t.original)}')">Reset to default</button>
      </div>
    </div>`;
  wireCard(b.name, t.original, card);
  wireCaps(card);  // live byte-count on the tool "Description" textarea
  return card;
}

function paramRow(p) {
  const name = p.name || p.default_name;
  const desc = p.description || p.default_description || '';
  const req = p.required ? '<span class="req" title="required by the backend">*</span>' : '';
  return `<div class="param" data-original="${esc(p.original)}">
    <div class="p-top"><span class="orig" title="real MCP parameter name (provider-facing, not editable)">${esc(p.original)}${req}</span>
      <label class="chk"><input type="checkbox" class="p-hide" ${p.hide?'checked':''}> hide</label></div>
    <div class="row" style="margin-top:8px;">
      <div><label>Broadcast name</label><input type="text" class="p-name" value="${esc(name)}" data-default="${esc(p.default_name)}"></div>
      <div><label>Description</label><input type="text" class="p-desc" value="${esc(desc)}" data-default="${esc(p.default_description||'')}"></div>
    </div></div>`;
}

// Read-only schema surface (issue #2): a tool's outputSchema, _meta (FastMCP
// tags + our anthropic/alwaysLoad pin) and ToolAnnotations (readOnly/destructive/
// idempotent/openWorld) as captured from the wire. Shown only when the backend
// advertises them; display only, never editable. Reuses the .instr card, the .si
// muted label, and the .preview JSON box.
function schemaSection(t) {
  const block = (label, obj) =>
    (obj && Object.keys(obj).length)
      ? `<div class="si" style="margin-top:10px">${label}</div>
         <pre class="preview" style="margin:4px 0 0">${esc(JSON.stringify(obj, null, 2))}</pre>`
      : '';
  const body = block('output schema', t.output_schema)
    + block('_meta', t.meta)
    + block('annotations', t.annotations);
  if (!body) return '';
  return `<div class="instr" style="margin:14px 0 4px">
    <h3>Schema &amp; metadata <span class="si" style="font-weight:400">· read-only</span></h3>${body}</div>`;
}

// Wire auto-save: debounce on input; flush immediately on blur; refill a
// cleared field with its default so it is never effectively empty.
function wireCard(backend, original, card) {
  card.querySelectorAll('input, textarea').forEach(inp => {
    if (inp.type === 'checkbox') {
      inp.addEventListener('change', () => scheduleSave(backend, original, card));
      return;
    }
    inp.addEventListener('input', () => scheduleSave(backend, original, card));
    inp.addEventListener('blur', () => {
      if (inp.dataset.default !== undefined && inp.value.trim() === '' && inp.dataset.default !== '') {
        inp.value = inp.dataset.default;  // never leave it blank — fall back to default
        if (inp.classList.contains('f-name')) $('.newname', card).textContent = inp.value;
      }
      flushSave(backend, original, card);  // persist on leaving the field
    });
  });
}

function gather(card) {
  const params = [...card.querySelectorAll('.param')].map(pe => ({
    original: pe.dataset.original,
    name: $('.p-name', pe).value,
    description: $('.p-desc', pe).value,
    hide: $('.p-hide', pe).checked,
  }));
  return {
    name: $('.f-name', card).value,
    title: $('.f-title', card).value,
    description: $('.f-desc', card).value,
    enabled: $('.f-enabled', card).checked,
    always_load: $('.f-always', card).checked,
    params,
  };
}

const pending = {};  // key -> {backend, original, card} for edits not yet persisted

function scheduleSave(backend, original, card) {
  const key = backend + '::' + original;
  clearTimeout(timers[key]);
  pending[key] = { backend, original, card };
  card.classList.toggle('disabled', !$('.f-enabled', card).checked);
  $('.newname', card).textContent = $('.f-name', card).value.trim() || card.dataset.defaultName;
  timers[key] = setTimeout(() => doSave(backend, original, card), 550);  // debounce
}

// Persist one tool's override. Each change is written to config.toml (atomic +
// fsync) server-side, so nothing is lost on crash. keepalive lets it finish
// during page unload.
async function doSave(backend, original, card, keepalive = false) {
  const key = backend + '::' + original;
  clearTimeout(timers[key]); delete timers[key]; delete pending[key];
  const body = JSON.stringify({ backend, tool_original: original, override: gather(card) });
  try {
    const r = await fetch('/admin/api/override',
      { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body, keepalive });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast('save failed: ' + (j.error || ('HTTP ' + r.status))); pending[key] = { backend, original, card }; return; }
    flashSaved();
  } catch (e) { toast('save failed: ' + e.message); pending[key] = { backend, original, card }; }
}

// Flush an edit immediately (on blur), but only if there is an unsaved change.
function flushSave(backend, original, card) {
  const key = backend + '::' + original;
  if (timers[key] || pending[key]) doSave(backend, original, card);
}

// Last-resort durability: persist any still-pending edits as the page closes.
window.addEventListener('beforeunload', () => {
  Object.values(pending).forEach(({ backend, original, card }) => doSave(backend, original, card, true));
  Object.values(instrPending).forEach(({ backend, ta }) => doSaveInstr(backend, ta, true));
});

// --- instructions save (per-backend: backend = name) ---------------------
const instrPending = {};  // key -> textarea for an unsaved instructions edit
function instrKey(backend) { return 'instr::' + (backend ?? GATEWAY); }

function scheduleInstr(backend, ta) {
  const key = instrKey(backend);
  clearTimeout(timers[key]);
  instrPending[key] = { backend, ta };
  timers[key] = setTimeout(() => doSaveInstr(backend, ta), 550);
}
function flushInstr(backend, ta) {
  const key = instrKey(backend);
  if (timers[key] || instrPending[key]) doSaveInstr(backend, ta);
}
async function doSaveInstr(backend, ta, keepalive = false) {
  const key = instrKey(backend);
  clearTimeout(timers[key]); delete timers[key]; delete instrPending[key];
  const body = JSON.stringify({ backend, value: ta.value });
  try {
    const r = await fetch('/admin/api/instructions',
      { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body, keepalive });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { toast('save failed: ' + (j.error || ('HTTP ' + r.status))); instrPending[key] = { backend, ta }; return; }
    flashSaved();
  } catch (e) { toast('save failed: ' + e.message); instrPending[key] = { backend, ta }; }
}

async function resetTool(backend, original) {
  try { await api('POST', '/admin/api/reset', { backend, tool_original: original }); await load(); toast('reset to default'); }
  catch (e) { toast('reset failed: ' + e.message); }
}
async function reintrospect(name) {
  try { await api('POST', '/admin/api/introspect/' + encodeURIComponent(name)); await load(); toast('re-introspected ' + name); }
  catch (e) { toast('introspect failed: ' + e.message); }
}
async function pinBackend(name, value) {
  try { await api('POST', '/admin/api/backend/' + encodeURIComponent(name) + '/pin', { value }); toast(value ? 'pinned all tools (eager)' : 'unpinned'); }
  catch (e) { toast('pin failed: ' + e.message); }
}
async function delBackend(name) {
  if (!confirm('Remove backend "' + name + '"? This restarts the gateway.')) return;
  try { await api('DELETE', '/admin/api/backend/' + encodeURIComponent(name)); SELECTED = null; toast('removed — restarting…'); waitReload(); }
  catch (e) { toast('remove failed: ' + e.message); }
}

// import modal
function openImport() { $('#importBg').classList.add('show'); $('#im_err').textContent = ''; }
function closeImport() { $('#importBg').classList.remove('show'); }
function importTransportChange() {
  // http / streamable-http / sse all use the URL+auth fields; only stdio differs.
  const stdio = $('#im_transport').value === 'stdio';
  $('#im_http').style.display = stdio ? 'none' : '';
  $('#im_stdio').style.display = stdio ? '' : 'none';
}
async function doImport() {
  const t = $('#im_transport').value;
  const stdio = t === 'stdio';
  const body = { name: $('#im_name').value.trim(), transport: t,
    stateless: !stdio };
  if (!stdio) { body.url = $('#im_url').value.trim(); body.auth_header = $('#im_ah').value.trim(); body.auth_value = $('#im_av').value.trim(); }
  else { body.command = $('#im_cmd').value.trim(); body.args = $('#im_args').value.trim() ? $('#im_args').value.trim().split(/\s+/) : []; }
  $('#im_go').disabled = true; $('#im_err').textContent = 'connecting…';
  try { const r = await api('POST', '/admin/api/backend', body); closeImport(); SELECTED = r.backend; toast('imported — restarting gateway…'); waitReload(); }
  catch (e) { $('#im_err').textContent = e.message; }
  finally { $('#im_go').disabled = false; }
}

// after a restart-triggering change, poll until the gateway is back, then reload
async function waitReload() {
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 700));
    try { const h = await fetch('/health'); if (h.ok) { await load(); toast('gateway back up'); return; } } catch {}
  }
  toast('gateway did not come back — check logs');
}

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

load();
</script>
