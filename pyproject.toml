[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "mcp-local-gateway"
version = "1.3.1"
description = "Independent MCP gateway with per-backend proxy and virtual-tool endpoints"
readme = "README.md"
# Python 3.12 and 3.13 are the supported runtime minors. Do not widen this
# range until a new minor is explicitly exercised in CI and documented.
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "voidfreud" }]
keywords = ["mcp", "proxy", "fastmcp", "claude-code", "gateway"]
# The PyPI distribution name is mcp-local-gateway (the mcp-gateway name is
# taken there). The import package and console command stay mcp_gateway /
# mcp-gateway. No blocker classifier: tagged releases publish to PyPI via
# Trusted Publishing.
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Private compatibility seams are guarded in tests/test_fastmcp_compat.py.
    # Upgrade deliberately: change this pin, refresh uv.lock, and run the full gate.
    "fastmcp==3.4.5",
    "pydantic>=2.13.4",
    "structlog>=26.1.0",
    "tomli-w>=1.2.0",
]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"

[project.urls]
Repository = "https://github.com/voidfreud/mcp-gateway"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]
# admin.html + config.default.toml ship inside the package (server reads them
# via Path(__file__).parent)
artifacts = ["src/mcp_gateway/admin.html", "src/mcp_gateway/config.default.toml"]

[tool.hatch.build.targets.sdist]
# A source archive is a build input, not a repository mirror.  Keep it to the
# installable package and the metadata files required to rebuild it.
only-include = ["src/mcp_gateway", "README.md", "LICENSE", "pyproject.toml"]

[dependency-groups]
dev = [
    # The release contract builds without isolation from this locked backend.
    "hatchling==1.31.0",
    "httpx2>=2.9.1",
    "hypothesis>=6.164.0",
    "jsonschema>=4.26.0",
    "pip-audit==2.10.1",
    "pytest>=9.1.1",
    "ruff==0.16.1",
    # Advisory type-debt baseline; keep it reproducible without adding
    # suppressions or source exclusions.
    "ty==0.0.63",
]

[tool.uv]
required-version = "==0.10.9"

[tool.ruff]
# corpus/ stores retained source pointers and provenance records rather than
# lintable project code; our own code — including .agents/ skill scripts —
# stays in scope.
# .claude/worktrees holds agent checkouts (gitignored) — each runs its own
# gate; linting them from the parent tree double-reports their WIP.
extend-exclude = ["corpus", ".claude/worktrees"]

[tool.ruff.lint]
# Extended set adopted in #89. Complexity leftovers carry per-line noqa with
# the reason at the site.
select = ["E", "W", "F", "I", "UP", "B", "C4", "PL"]
ignore = [
    # Magic-value comparisons: dominated by HTTP statuses (200/400) and test
    # assertions where a named constant would obscure, not clarify.
    "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
# Tests: local imports keep optional/slow deps out of collection; fixture
# factories and wire helpers legitimately take many keyword/positional params.
"tests/*" = ["PLC0415", "PLR0912", "PLR0913", "PLR0917"]
# Skill scripts are CLI report tools: docstring usage examples overflow 88
# cols, and the print tree is one long cohesive walk.
".agents/skills/*" = ["E501", "PLR0912", "PLR0915"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
