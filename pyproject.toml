[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Local MCP proxy that rewrites every broadcast text a backend MCP shows Claude Code"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "voidfreud" }]
keywords = ["mcp", "proxy", "fastmcp", "claude-code", "gateway"]
# Private tool — the classifier blocks an accidental PyPI upload. No license is
# declared (this repo is private, not distributed).
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "fastmcp>=3.4.2",
    "pydantic>=2.13.4",
    "structlog>=26.1.0",
    "tomli-w>=1.2.0",
]

[project.urls]
Repository = "https://github.com/voidfreud/mcp-gateway"

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "pytest>=9.1.1",
]

[tool.ruff]
# corpus/ is read-only third-party source material (never reformat upstream
# code); our own code — including .claude/ skill scripts — stays in scope.
extend-exclude = ["corpus"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
