[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Local MCP proxy that rewrites every broadcast text a backend MCP shows Claude Code"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.2",
    "pydantic>=2.13.4",
    "structlog>=26.1.0",
    "tomli-w>=1.2.0",
]

[dependency-groups]
dev = [
    "hypothesis>=6.155.7",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
