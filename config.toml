# mcp-gateway config — backends + per-tool broadcast-text rewrites.
#
# Seeded with two backends already on this machine (no secrets needed):
# gitnexus (stdio) + deepwiki (remote http). Both are PASSTHROUGH — no overrides
# — so every tool reaches Claude exactly as the backend broadcasts it (names
# prefixed `<backend>_*`). Shape what Claude sees in the admin UI, where each
# field prefills with the original. See config.example.toml for the schema.

host = "127.0.0.1"
port = 9100
log_file = "~/.local/state/mcp-gateway/gateway.log"

# --------------------------------------------------------------------------
# gitnexus — local stdio backend. PASSTHROUGH: no overrides, so every gitnexus
# tool reaches Claude exactly as gitnexus broadcasts it (names prefixed
# `gitnexus_*`). Edit any of them in the admin UI to see original → your change.
# --------------------------------------------------------------------------
[[backends]]
name = "gitnexus"
transport = "stdio"
command = "/Users/alexanderbass/.local/bin/gitnexus"
args = ["mcp"]
stateless = false

# --------------------------------------------------------------------------
# deepwiki — remote http backend. PASSTHROUGH: no overrides (original names
# `deepwiki_*` reach Claude). Edit in the admin UI to shape what Claude sees.
# --------------------------------------------------------------------------
[[backends]]
name = "deepwiki"
transport = "http"
url = "https://mcp.deepwiki.com/mcp"
stateless = true
# For an authed backend, add:
#   auth_header = "Authorization"
#   auth_value  = "Bearer ${DEEPWIKI_TOKEN}"   # value resolved from env
