# GitNexus backend settings mirrored into the live, gitignored config.toml.
# The gateway admin UI owns config.toml; keep this tracked fragment authoritative.
command = "/opt/homebrew/bin/gitnexus"
args = ["mcp"]
stateless = false
enabled = true
env = { GITNEXUS_MCP_READ_ONLY = "1", GITNEXUS_EMBEDDING_URL = "https://openrouter.ai/api/v1", GITNEXUS_EMBEDDING_MODEL = "qwen/qwen3-embedding-8b", GITNEXUS_EMBEDDING_API_KEY = "${OPENROUTER_API_KEY}", GITNEXUS_EMBEDDING_DIMS = "2048", GITNEXUS_EMBEDDING_BATCH_SIZE = "32", GITNEXUS_EMBEDDING_SUB_BATCH_SIZE = "32", GITNEXUS_EMBEDDING_MAX_ATTEMPTS = "5", GITNEXUS_EMBEDDING_RETRY_CAP_MS = "30000", GITNEXUS_EMBEDDING_MIN_INTERVAL_MS = "250", GITNEXUS_LBUG_BUFFER_POOL_SIZE = "1073741824", GITNEXUS_MCP_DEFAULT_MAX_TOKENS = "8000", GITNEXUS_FTS_STEMMER = "porter", GITNEXUS_FTS_CJK_SEGMENTATION = "none", GITNEXUS_COMMUNITY_ENGINE = "graphology", GITNEXUS_STREAM_GRAPH_EMIT = "1", GITNEXUS_LBUG_EXTENSION_INSTALL = "load-only" }
