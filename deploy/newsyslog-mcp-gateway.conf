# newsyslog(8) config for mcp-gateway's launchd-owned logs (issue #50).
#
# The daemon routes ALL of its own + library logging into the rotating
# gateway.log (see server._configure_logging), so err.log / out.log now only
# catch rare pre-init or hard-crash text. This file is an OPTIONAL
# belt-and-suspenders cap for that residual. Install once (root-owned dir):
#     sudo cp deploy/newsyslog-mcp-gateway.conf /etc/newsyslog.d/com.void.mcp-gateway.conf
# Validate (needs root on macOS):
#     sudo newsyslog -n -v -f /etc/newsyslog.d/com.void.mcp-gateway.conf
#
# Flags (per newsyslog.conf(5)): N = no process to signal on rotation (launchd
# owns the fd; we can't signal it), Z = gzip the rotated file.
#
# Caveat: because launchd holds err.log/out.log open, after newsyslog moves the
# file the daemon keeps writing to the rotated inode until its next restart.
# Harmless here — almost nothing is written to these two files anymore.
#
# logfilename                                            [owner:group]       mode count size  when flags
/Users/alexanderbass/.local/state/mcp-gateway/err.log    alexanderbass:staff 644  5     5120  *    NZ
/Users/alexanderbass/.local/state/mcp-gateway/out.log    alexanderbass:staff 644  5     5120  *    NZ
