# mcp-gateway config — annotated schema/template.
# Copy to config.toml and edit. Secrets are never hardcoded: write ${ENV_VAR}
# and the loader resolves it from the process environment first, then the
# gateway secrets file (~/.config/mcp-gateway/secrets.env, overridable with
# MCP_GATEWAY_SECRETS).

host = "127.0.0.1"          # loopback by default. A non-loopback bind (e.g. a
                            # Tailscale IP) REQUIRES bearer_token or a complete
                            # [oauth] profile with admin_bearer_token; otherwise
                            # the config refuses to load (docs/security.md).
port = 9100
log_file = "~/.local/state/mcp-gateway/gateway.log"
# Structured event verbosity: DEBUG, INFO, WARNING, ERROR, or CRITICAL.
# log_level = "INFO"
# Retention cap: one active file plus this many rotated backups.
# log_max_bytes = 5242880 # 5 MiB
# log_backup_count = 5
# introspect_interval = 900 # seconds between scheduled re-captures of every
#                           # backend's tool list. 0 / absent = OFF (default):
#                           # the event-driven refreshes — post-(re)connect,
#                           # tools/list_changed, admin page load — cover
#                           # everything but a long-lived remote backend that
#                           # hot-swaps tools silently (#43).
# baseline_max_age = 86400  # (#157) seconds a stored baseline stays "fresh":
#                           # the post-(re)mount refresh is SKIPPED while the
#                           # captured baseline is younger, sparing slow stdio
#                           # backends a second cold start per boot. Default
#                           # 86400 (24h); 0 = refresh on every mount. The
#                           # event-driven refreshes (tools/list_changed,
#                           # admin page load, Re-inspect) are never gated.
# update_check = true       # check PyPI at startup and daily for a newer stable
#                           # release; offline-tolerant and never auto-applies.
#                           # Set false for zero update-check network requests.
#
# Metadata byte limits (#286): strict UTF-8 caps on the server-level
# instructions and tool descriptions this gateway broadcasts to MCP clients.
# Each accepts an integer from 1 to 1,048,576 (1 MiB). The instructions cap
# limits AUTHORED overrides (backend `instructions`, admin/API/CLI writes);
# captured upstream text is truncated to the cap at a UTF-8 character
# boundary only when it is broadcast, with a warning. Tool-description caps
# apply the same way; precedence per tool is: the tool's
# description_max_bytes > the backend's tool_description_max_bytes > the
# gateway-wide tool_description_max_bytes.
# server_instructions_max_bytes = 2048   # default 2048 (backwards-compatible)
# tool_description_max_bytes = 4096      # default: unset = no cap (unlimited);
#                                        # top-level `unlimited` in the CLI

# Optional defense-in-depth (#26): require this bearer token on every backend
# MCP endpoint AND the admin API (/health, /ready and the bare GET /admin page
# stay open; the UI prompts once and keeps the token in localStorage). The bind is loopback-only
# already; this additionally shuts out curious local processes. ${ENV} ref,
# resolved once at startup. Clients pass it when registering the endpoint,
# e.g. Claude Code:
#   claude mcp add --transport http --header "Authorization: Bearer ${MCP_GATEWAY_TOKEN}" gateway-<name> http://127.0.0.1:9100/<name>/mcp
# bearer_token = "${MCP_GATEWAY_TOKEN}"

# Standard OAuth resource-server mode for remote deployments. The gateway does
# not issue tokens: your external OAuth/OIDC provider handles login, consent,
# PKCE, and token issuance. Each independent endpoint gets a distinct JWT
# audience and RFC 9728 protected-resource metadata route. `issuer` is kept
# byte-for-byte because JWT issuer matching is exact. Use HTTPS outside local
# development. A non-loopback bind requires a separate Admin token; it is never
# accepted as an MCP access token.
# [oauth]
# public_base_url = "https://gateway.example.com"
# authorization_servers = ["https://login.example.com/tenant"]
# issuer = "https://login.example.com/tenant"
# jwks_uri = "https://login.example.com/tenant/jwks"
# algorithm = "RS256"
# required_scopes = ["mcp:access"]
# admin_bearer_token = "${MCP_GATEWAY_ADMIN_TOKEN}"

# ===========================================================================
# A backend MCP server. Repeat the [[backends]] block per backend.
# transport = "http"  -> needs `url` (+ optional auth_header/auth_value)
# transport = "stdio" -> needs `command` (+ optional args, env)
# ===========================================================================
[[backends]]
# id = "1d78c28d-9cb5-4b69-b6ca-efdc17862822" # stable Virtual Tool identity;
                                   # assigned/persisted automatically on first use
name = "exa"                       # routing identity: drives the /exa/mcp
                                   # endpoint and the gateway-exa server name
                                   # clients register it under. Renaming it is
                                   # a topology change (admin "Rename…", #44):
                                   # restart + client re-registration.
                                   # Cosmetic label -> display_name instead
                                   # (#42).
transport = "http"
url = "https://your-exa-endpoint/mcp"
auth_header = "Authorization"      # optional; set BOTH or NEITHER
auth_value = "Bearer ${EXA_TOKEN}" # exactly ${VAR} or Bearer|Basic|Token ${VAR}
                                   # (never a literal or raw/ref mix)
# Richer auth (#6), all optional. Precedence on a same-name header clash:
# auth_header/auth_value pair > headers table > headers_helper output.
# headers = { "X-Client-Id" = "${MY_ID}" }  # extra static headers; a value
#                                   # under a credential-like key (token,
#                                   # secret, password, api-key, …) must be
#                                   # exactly ${VAR} or Bearer|Basic|Token
#                                   # ${VAR} — ordinary keys may be literal
# auth = "oauth"                     # OAuth-protected remote MCP: FastMCP runs
#                                    # the flow (browser consent on first
#                                    # connect, cached tokens after)
# headers_helper prints a JSON object of headers (tokens resolved at connect
# time); runs ONCE at mount/introspect, not per call and not on a timer — so it
# fits a token valid for the daemon's uptime (e.g. `gh auth token`), NOT one that
# must rotate mid-session (that's not refreshed until restart). Two forms:
#   list -> argv, run WITHOUT a shell (safe; no injection surface):
# headers_helper = ["my-sso-tool", "print-headers"]
#   str  -> run via the shell (for $()/pipes); FULL shell privilege, same trust
#           as a stdio `command`:
# headers_helper = "printf '{\"Authorization\": \"Bearer %s\"}' \"$(get-token)\""
stateless = true                   # fresh session per call. false (warm,
                                   # default) keeps one persistent connection
                                   # reused across calls and auto-repaired if
                                   # it dies (see docs/configuration.md)
# init_timeout = 30.0              # backend initialize handshake, seconds
# request_timeout = 300.0          # each forwarded backend request, seconds
# always_load = true               # pin ALL this backend's tools to load upfront
                                   # (eager — exempt from tool-search deferral)
#
# Per-backend metadata-limit overrides (#286): an integer from 1 to 1,048,576
# (1 MiB) that overrides the gateway-wide cap for THIS backend only.
# Unset = inherit the gateway value. Instructions precedence: backend over
# gateway; tool descriptions precedence: tool > backend > gateway.
# server_instructions_max_bytes = 1024
# tool_description_max_bytes = 4096

  # Per-tool rewrite. `original` is the backend's own tool name.
  # Any of name/title/description omitted -> left as the backend's.
  [[backends.tools]]
  original = "web_search_exa"
  name = "web_search"
  title = "Web Search"
  description = "Exactly what Claude should read for this tool."
  enabled = true                   # false -> tool is dropped from the listing
  always_load = true               # pin THIS tool to load upfront (eager)
  # max_result_chars = 100000      # per-tool output budget (#162): broadcast as
  #                                # _meta "anthropic/maxResultSizeChars" — Claude
  #                                # Code honors it over its global 25k-token cap.
  #                                # Positive integer; omit for the client default.
  # description_max_bytes = 1500   # per-tool cap on THIS tool's broadcast
  #                                # description (#286): overrides the backend
  #                                # and gateway caps; unset = inherit. Integer
  #                                # from 1 to 1,048,576.
  # Behavior hooks (#16): user-authored Python, "module:function" resolved in
  # the hooks dir (MCP_GATEWAY_HOOKS > ./hooks/ > ~/.config/mcp-gateway/hooks/).
  # ARBITRARY CODE EXECUTION in the daemon, by design — same trust as a stdio
  # `command`; see docs/security.md. Never eval'd, only imported from that dir.
  # validate = "myhooks:check_query"    # check_query(args: dict) runs BEFORE
  #                                     # the call; raise ValueError("why") to
  #                                     # reject it (message -> the caller).
  #                                     # args use the EXPOSED (post-rename)
  #                                     # names; hidden params are absent.
  # post_process = "myhooks:trim"       # trim(result) runs AFTER the backend
  #                                     # answered (truncate / strip / reshape
  #                                     # the ToolResult). Sync or async.

    [[backends.tools.params]]
    original = "query"
    name = "query"                 # omit to keep the original param name
    description = "What Claude should read for this parameter."

    [[backends.tools.params]]
    original = "internal_flag"
    hide = true                    # remove this param from the schema

    [[backends.tools.params]]
    original = "api_mode"
    hide = true                    # hidden from Claude…
    default = "strict"             # …but the gateway injects this value on
                                   # every call (#35). Scalar only (str/int/
                                   # float/bool). Required params can only be
                                   # hidden WITH a default; optional params
                                   # may take a default without hiding.

  # Per-resource rewrite (#15). `uri` is the resource's URI (or a template's
  # uriTemplate) — its identity, never rewritten. Only display text is
  # editable; enabled = false hides it from the listing AND blocks reads.
  # [[backends.resources]]
  # uri = "file://project/readme"
  # name = "Project readme"       # display name (free-form text)
  # title = "Readme"
  # description = "What Claude should read for this resource."
  # enabled = true

  # Per-prompt rewrite (#15). `original` is the backend's own prompt name.
  # Renames are real: Claude sees `name`, prompts/get reverse-maps to the
  # original. Argument NAMES are not renameable (the call forwards them
  # verbatim); their descriptions are.
  # [[backends.prompts]]
  # original = "summarize"
  # name = "summarize_document"
  # description = "What Claude should read for this prompt."
  # enabled = true
  #   [[backends.prompts.args]]
  #   original = "text"
  #   description = "What Claude should read for this argument."

# A local stdio backend looks like this:
# [[backends]]
# name = "serena"
# transport = "stdio"
# command = "uvx"
# args = ["serena-mcp"]
# env = { SOME_KEY = "${SOME_ENV}" }  # values under credential-like keys
#                                   # (DB_PASSWORD, API_KEY, …) must be
#                                   # exactly ${VAR} or Bearer|Basic|Token
#                                   # ${VAR}; ordinary keys may be literal;
#                                   # -file/-path/-dir/-directory env keys
#                                   # are exempt metadata paths (headers never)
# stateless = false

# ===========================================================================
# Virtual Tools — gateway-owned tools on the permanent /virtual/mcp endpoint.
# Prefer the Admin UI: create draft -> validate -> test -> activate.
# The member IDs below must match the stable `id` fields assigned to backends.
# ===========================================================================
# [[virtual_tools]]
# name = "web_search_everywhere"
# description = "Search both providers concurrently and preserve every result."
# description_max_bytes = 1500  # cap on THIS Virtual Tool's broadcast
#                               # description (#286); unset = inherit the
#                               # gateway-wide tool-description cap
# enabled = false
# dispatch = "all"                 # all | keyword | llm
# max_result_bytes = 262144
# failure_policy = "partial"       # partial | strict
#
