# mcp-gateway config — annotated schema/template.
# Copy to config.toml and edit. Secrets are never hardcoded: write ${ENV_VAR}
# and the loader resolves it from the environment (injected by the LaunchAgent).

host = "127.0.0.1"          # bind loopback only — never 0.0.0.0
port = 9100
log_file = "~/.local/state/mcp-gateway/gateway.log"
# introspect_interval = 900 # seconds between scheduled re-captures of every
#                           # backend's tool list. 0 / absent = OFF (default):
#                           # the event-driven refreshes — post-(re)connect,
#                           # tools/list_changed, admin page load — cover
#                           # everything but a long-lived remote backend that
#                           # hot-swaps tools silently (#43).

# Optional defense-in-depth (#26): require this bearer token on every backend
# MCP endpoint AND the admin API (/health, /ready and the bare GET /admin page
# stay open; the UI prompts once and keeps the token in localStorage). The bind is loopback-only
# already; this additionally shuts out curious local processes. ${ENV} ref,
# resolved once at startup. Claude Code passes it at registration:
#   claude mcp add --transport http --header "Authorization: Bearer ${MCP_GATEWAY_TOKEN}" gateway-<name> http://127.0.0.1:9100/<name>/mcp
# bearer_token = "${MCP_GATEWAY_TOKEN}"

# ===========================================================================
# A backend MCP server. Repeat the [[backends]] block per backend.
# transport = "http"  -> needs `url` (+ optional auth_header/auth_value)
# transport = "stdio" -> needs `command` (+ optional args, env)
# ===========================================================================
[[backends]]
name = "exa"                       # routing identity: drives the /exa/mcp
                                   # endpoint + the gateway-exa Claude Code
                                   # registration. Renaming it is a topology
                                   # change (admin "Rename…", #44): restart +
                                   # CC re-registration. Cosmetic label ->
                                   # display_name instead (#42).
transport = "http"
url = "https://your-exa-endpoint/mcp"
auth_header = "Authorization"      # optional; set BOTH or NEITHER
auth_value = "Bearer ${EXA_TOKEN}" # ${ENV} resolved at startup
# Richer auth (#6), all optional. Precedence on a same-name header clash:
# auth_header/auth_value pair > headers table > headers_helper output.
# headers = { "X-Client-Id" = "${MY_ID}" }  # extra static headers, ${ENV} ok
# auth = "oauth"                     # OAuth-protected remote MCP: FastMCP runs
#                                    # the flow (browser consent on first
#                                    # connect, cached tokens after)
# headers_helper prints a JSON object of headers (tokens resolved at connect
# time); runs ONCE at mount/introspect, not per call and not on a timer — so it
# fits a token valid for the daemon's uptime (e.g. `gh auth token`), NOT one that
# must rotate mid-session (that's not refreshed until restart). Two forms:
#   list -> argv, run WITHOUT a shell (safe; no injection surface):
# headers_helper = ["my-sso-tool", "print-headers"]
#   str  -> run via the shell (for $()/pipes); FULL shell privilege, same trust
#           as a stdio `command`:
# headers_helper = "printf '{\"Authorization\": \"Bearer %s\"}' \"$(get-token)\""
stateless = true                   # parsed; shared-session reuse is a
                                   # tier-2 optimisation (see README)
# always_load = true               # pin ALL this backend's tools to load upfront
                                   # (eager — exempt from tool-search deferral)

  # Per-tool rewrite. `original` is the backend's own tool name.
  # Any of name/title/description omitted -> left as the backend's.
  [[backends.tools]]
  original = "web_search_exa"
  name = "web_search"
  title = "Web Search"
  description = "Exactly what Claude should read for this tool."
  enabled = true                   # false -> tool is dropped from the listing
  always_load = true               # pin THIS tool to load upfront (eager)

    [[backends.tools.params]]
    original = "query"
    name = "query"                 # omit to keep the original param name
    description = "What Claude should read for this parameter."

    [[backends.tools.params]]
    original = "internal_flag"
    hide = true                    # remove this param from the schema

    [[backends.tools.params]]
    original = "api_mode"
    hide = true                    # hidden from Claude…
    default = "strict"             # …but the gateway injects this value on
                                   # every call (#35). Scalar only (str/int/
                                   # float/bool). Required params can only be
                                   # hidden WITH a default; optional params
                                   # may take a default without hiding.

# A local stdio backend looks like this:
# [[backends]]
# name = "serena"
# transport = "stdio"
# command = "uvx"
# args = ["serena-mcp"]
# env = { SOME_KEY = "${SOME_ENV}" }
# stateless = false

# ── Code mode (#13) ──────────────────────────────────────────────────────────
# Opt-in: serve three meta-tools at /meta/mcp — search (rank tools across every
# mounted backend by keyword), get_schema (one tool's full EXPOSED definition,
# post-rewrite), execute (call any tool through the gateway's own proxy path,
# so every override applies). Lets an agent script against the whole catalog
# instead of loading every tool. Off by default: disabled = endpoint absent.
# The backend name "meta" is reserved while enabled.
#
# [meta]
# enabled = true

# ── Composite tools (#14) ────────────────────────────────────────────────────
# A composite is a synthetic tool the gateway itself serves at /composite/mcp:
# one call fans out to every member tool CONCURRENTLY (each member bounded by
# its own timeout) and returns a single labeled merge. A failed/timed-out
# member reports itself inside the merge; only all-members-failed errors the
# call. Members are called through the gateway's own per-backend endpoints, so
# every override applies — `tool` is the EXPOSED (post-rename) tool name.
# The backend name "composite" is reserved while composites are configured.
#
# [[composites]]
# name = "web_search"                # the tool name Claude sees (letters/digits/_/-)
# description = "Search the web across every provider at once."
# enabled = true                     # false -> not broadcast (toggle via admin API)
# always_load = true                 # pin the composite to load upfront (eager)
# strategy = "all"                   # member selection; "all" = fan out to every
#                                    # member (the seam smart routing will plug into)
#
#   # The composite's OWN parameter schema (authored, not captured):
#   [[composites.params]]
#   name = "query"
#   type = "string"                  # string | integer | number | boolean
#   description = "The search query."
#   # required = true                # default; optional params may set `default`
#
#   [[composites.params]]
#   name = "limit"
#   type = "integer"
#   required = false
#   default = 5
#
#   # Members: backend + EXPOSED tool name + how composite params map on:
#   [[composites.members]]
#   backend = "Exa"
#   tool = "search_web"
#   label = "exa"                    # section label in the merged output
#   timeout = 30.0                   # seconds; this member alone times out
#   args = { query = "query" }      # member param = composite param
#
#   [[composites.members]]
#   backend = "Tavily"
#   tool = "search_web_filtered"
#   args = { query = "query", max_results = "limit" }
#   static_args = { search_depth = "basic" }   # fixed value injected every call
