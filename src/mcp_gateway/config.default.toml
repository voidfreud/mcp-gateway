# mcp-gateway config. Managed by the admin UI at http://127.0.0.1:9100/admin.
# Hand-edits are fine but comments are not preserved on UI save.
# Secrets: use ${ENV_VAR} refs only; values come from the environment.

host = "127.0.0.1"
port = 9100
log_file = "~/.local/state/mcp-gateway/gateway.log"
# log_level = "INFO"       # DEBUG, INFO, WARNING, ERROR, or CRITICAL
# log_max_bytes = 5242880  # active-file cap (5 MiB by default)
# log_backup_count = 5     # rotated files kept in addition to the active file

[[backends]]
name = "gitnexus"
transport = "stdio"
# Resolved from PATH so the seed is portable; ensure the tool is installed (or
# use an absolute path). A backend that can't be found is skipped, not fatal.
command = "gitnexus"
args = [
    "mcp",
]
stateless = false

[[backends]]
name = "deepwiki"
transport = "http"
url = "https://mcp.deepwiki.com/mcp"
stateless = true

[[backends]]
name = "context7"
transport = "http"
url = "https://mcp.context7.com/mcp"
stateless = true
